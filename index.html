<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대한민국 생명안전의제 운동 타임라인</title>
<style>
:root {
  --red:    #c0392b;
  --red2:   #e74c3c;
  --gray1:  #1a1a1a;
  --gray2:  #444;
  --gray3:  #888;
  --gray4:  #bbb;
  --gray5:  #e8e8e8;
  --gray6:  #f5f5f5;
  --white:  #fff;
  --cat-sewol:    #c0392b;
  --cat-disaster: #e67e22;
  --cat-labor:    #2980b9;
  --cat-movement: #27ae60;
  --cat-law:      #8e44ad;
  --shadow: 0 2px 8px rgba(0,0,0,.1);
  --radius: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--gray1);background:#fff;font-size:14px}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.header{padding:28px 40px 0;border-bottom:2px solid var(--gray1)}
.header h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.header h1 span{color:var(--red)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0 10px}
.tbtn{padding:6px 13px;border:1.5px solid var(--gray4);border-radius:20px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--gray2);transition:.15s}
.tbtn:hover{background:var(--gray6)}
.tbtn.active{background:var(--gray1);color:#fff;border-color:var(--gray1)}
.tbtn.red{border-color:var(--red);color:var(--red)}
.tbtn.red:hover{background:var(--red);color:#fff}
.tbtn.sheet{border-color:#34a853;color:#34a853}
.tbtn.sheet:hover{background:#34a853;color:#fff}
.tbtn.saving{opacity:.6;pointer-events:none}
.toolbar-right{display:flex;gap:8px;margin-left:auto}

/* ── CATEGORY FILTER ── */
.cat-bar{display:flex;align-items:center;gap:8px;padding:10px 40px;background:var(--gray6);border-bottom:1px solid var(--gray5);flex-wrap:wrap}
.cat-bar span{font-size:11px;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.cat-pill{padding:5px 14px;border-radius:20px;border:1.5px solid;cursor:pointer;font-size:12px;font-weight:700;transition:.15s;background:#fff}
.cat-pill:hover{opacity:.8}
.cat-pill.all{border-color:var(--gray1);color:var(--gray1)}
.cat-pill.all.on{background:var(--gray1);color:#fff}
.cat-pill.세월호{border-color:var(--cat-sewol);color:var(--cat-sewol)}
.cat-pill.세월호.on{background:var(--cat-sewol);color:#fff}
.cat-pill.재난{border-color:var(--cat-disaster);color:var(--cat-disaster)}
.cat-pill.재난.on{background:var(--cat-disaster);color:#fff}
.cat-pill.산업재해{border-color:var(--cat-labor);color:var(--cat-labor)}
.cat-pill.산업재해.on{background:var(--cat-labor);color:#fff}
.cat-pill\.운동\/조직,.cat-pill[data-cat="운동/조직"]{border-color:var(--cat-movement);color:var(--cat-movement)}
.cat-pill[data-cat="운동/조직"].on{background:var(--cat-movement);color:#fff}
.cat-pill[data-cat="입법/정책"]{border-color:var(--cat-law);color:var(--cat-law)}
.cat-pill[data-cat="입법/정책"].on{background:var(--cat-law);color:#fff}

/* ── MAIN LAYOUT ── */
.layout{display:flex;min-height:calc(100vh - 130px)}
.timeline-col{flex:1;min-width:0;padding:0 40px 60px;overflow-y:auto}
.detail-col{width:360px;flex-shrink:0;border-left:1px solid var(--gray5);position:sticky;top:0;height:calc(100vh - 130px);overflow-y:auto;background:#fff}
.detail-col.hidden{display:none}

/* ── YEAR GROUP ── */
.year-group{margin-top:36px}
.year-group.hidden{display:none}
.year-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--gray1)}
.year-label{font-size:22px;font-weight:800}
.conn-pill{padding:4px 12px;border-radius:20px;background:var(--gray1);color:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;position:relative}
.conn-pill:hover{background:var(--red)}
.conn-popup{position:absolute;top:calc(100% + 8px);left:0;z-index:100;background:#fff;color:var(--gray1);border:1.5px solid var(--gray1);border-radius:var(--radius);padding:14px 16px;min-width:220px;max-width:320px;box-shadow:var(--shadow);font-size:13px;line-height:1.6;display:none}
.conn-popup.open{display:block}
.conn-popup-title{font-weight:800;margin-bottom:6px;font-size:12px;color:var(--gray3);text-transform:uppercase;letter-spacing:.4px}
.conn-popup .close-btn{position:absolute;top:8px;right:10px;cursor:pointer;font-size:16px;color:var(--gray3)}
.add-year-btn{padding:3px 10px;border:1.5px dashed var(--gray4);border-radius:20px;background:transparent;cursor:pointer;font-size:11px;color:var(--gray3);transition:.15s}
.add-year-btn:hover{border-color:var(--gray2);color:var(--gray2)}

/* ── EVENT CARD ── */
.event-card{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--gray5);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;transition:.15s;background:#fff}
.event-card:hover{border-color:var(--gray3);box-shadow:var(--shadow)}
.event-card.selected{border-color:var(--red);box-shadow:0 0 0 2px rgba(192,57,43,.15)}
.event-card.cat-hidden{display:none}
.ec-left{padding:14px 16px;border-right:1px solid var(--gray5)}
.ec-title{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:6px}
.ec-date{font-size:11px;color:var(--gray3);margin-bottom:8px}
.ec-cats{display:flex;flex-wrap:wrap;gap:4px}
.cat-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;border:1.2px solid}
.cat-tag.세월호{border-color:var(--cat-sewol);color:var(--cat-sewol)}
.cat-tag.재난{border-color:var(--cat-disaster);color:var(--cat-disaster)}
.cat-tag.산업재해{border-color:var(--cat-labor);color:var(--cat-labor)}
.cat-tag\.운동\/조직,.cat-tag[data-cat="운동/조직"]{border-color:var(--cat-movement);color:var(--cat-movement)}
.cat-tag[data-cat="입법/정책"]{border-color:var(--cat-law);color:var(--cat-law)}
.ec-more{font-size:11px;color:var(--red);margin-top:4px;font-weight:600}
.ec-col{padding:14px 16px;border-right:1px solid var(--gray5);font-size:12px;line-height:1.6;color:var(--gray2)}
.ec-col:last-child{border-right:none}
.ec-col-label{font-size:10px;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.ec-text{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ── COL HEADERS ── */
.col-headers{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:6px 0 4px;border-bottom:1px solid var(--gray5);margin-bottom:6px}
.col-hdr{padding:0 16px;font-size:10px;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.5px}
.col-hdr:first-child{color:var(--red2)}

/* ── DETAIL PANEL ── */
.dp{padding:24px 22px}
.dp-close{float:right;cursor:pointer;font-size:18px;color:var(--gray3);line-height:1}
.dp-close:hover{color:var(--gray1)}
.dp-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dp-title{font-size:18px;font-weight:800;line-height:1.3;margin-bottom:4px}
.dp-date{font-size:12px;color:var(--gray3);margin-bottom:18px}
.dp-section{margin-bottom:16px}
.dp-section-title{font-size:10px;font-weight:800;color:var(--gray3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--gray5)}
.dp-text{font-size:13px;line-height:1.7;color:var(--gray1)}
.dp-links{display:flex;flex-direction:column;gap:4px}
.dp-link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--red);word-break:break-all}
.dp-link::before{content:'↗';font-size:11px;flex-shrink:0}
.dp-edit-btn{display:block;width:100%;padding:9px;border:1.5px solid var(--gray4);border-radius:var(--radius);background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:var(--gray2);text-align:center;transition:.15s;margin-top:12px}
.dp-edit-btn:hover{background:var(--gray1);color:#fff;border-color:var(--gray1)}

/* ── EDIT MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:10px;padding:28px 28px 20px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.18)}
.modal-title{font-size:16px;font-weight:800;margin-bottom:20px}
.ef-row{margin-bottom:14px}
.ef-label{display:block;font-size:11px;font-weight:700;color:var(--gray3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.ef-input,.ef-textarea{width:100%;padding:8px 11px;border:1.5px solid var(--gray5);border-radius:var(--radius);font-size:13px;font-family:inherit;color:var(--gray1);transition:.15s}
.ef-input:focus,.ef-textarea:focus{outline:none;border-color:var(--gray3)}
.ef-textarea{resize:vertical;min-height:72px}
.ef-cats{display:flex;flex-wrap:wrap;gap:8px}
.ef-cat-cb{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:13px;font-weight:600}
.ef-cat-cb input{cursor:pointer}
.ef-hint{font-size:11px;color:var(--gray3);margin-top:3px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--gray5)}
.btn-save{padding:9px 22px;background:var(--gray1);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:700;transition:.15s}
.btn-save:hover{background:var(--red)}
.btn-cancel{padding:9px 18px;background:#fff;color:var(--gray2);border:1.5px solid var(--gray4);border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn-cancel:hover{background:var(--gray6)}
.btn-delete{padding:9px 18px;background:#fff;color:#c0392b;border:1.5px solid #c0392b;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;margin-right:auto;transition:.15s}
.btn-delete:hover{background:#c0392b;color:#fff}

/* ── CONN EDIT MODAL ── */
.conn-modal{width:460px}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gray1);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── EMPTY STATE ── */
.empty-state{padding:60px 40px;text-align:center;color:var(--gray3)}
.empty-state p{font-size:15px;margin-bottom:12px}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .detail-col{display:none}
  .event-card{grid-template-columns:140px 1fr}
  .ec-col:nth-child(3),.ec-col:nth-child(4){display:none}
  .col-headers{grid-template-columns:140px 1fr}
  .col-hdr:nth-child(3),.col-hdr:nth-child(4){display:none}
}
@media(max-width:600px){
  .header{padding:20px 16px 0}
  .cat-bar,.timeline-col{padding-left:16px;padding-right:16px}
  .event-card{grid-template-columns:1fr}
  .ec-col{display:none}
  .col-headers{display:none}
}
</style>
</head>
<body>

<div class="header">
  <h1>대한민국 <span>생명안전의제</span> 운동 타임라인<br><small style="font-size:14px;font-weight:500;color:var(--gray3)">1994 – 2026</small></h1>
  <div class="toolbar">
    <button class="tbtn active" id="view-all-btn">전체 보기</button>
    <div class="toolbar-right">
      <button class="tbtn sheet" id="sheet-load-btn">📥 시트에서 불러오기</button>
      <button class="tbtn sheet" id="sheet-save-btn">☁️ 시트에 저장</button>
      <button class="tbtn" id="exp-btn">↓ JSON 저장</button>
    </div>
  </div>
</div>

<div class="cat-bar">
  <span>카테고리</span>
  <button class="cat-pill all on" data-cat="all">전체</button>
  <button class="cat-pill 세월호" data-cat="세월호">세월호</button>
  <button class="cat-pill 재난" data-cat="재난">재난</button>
  <button class="cat-pill 산업재해" data-cat="산업재해">산업재해</button>
  <button class="cat-pill" data-cat="운동/조직">운동/조직</button>
  <button class="cat-pill" data-cat="입법/정책">입법/정책</button>
</div>

<div class="layout">
  <div class="timeline-col" id="timeline-col">
    <div class="col-headers">
      <div class="col-hdr">대표 사건</div>
      <div class="col-hdr">배경 및 경과</div>
      <div class="col-hdr">쟁점과 의의</div>
      <div class="col-hdr">시민사회 대응·결과·입법</div>
    </div>
    <div id="timeline"></div>
  </div>
  <div class="detail-col hidden" id="detail-col">
    <div class="dp" id="detail-panel"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="edit-modal">
    <div class="modal-title" id="modal-title">새 사건 추가</div>
    <input type="hidden" id="ef-id">
    <div class="ef-row">
      <label class="ef-label">날짜 <span style="font-weight:400;color:var(--gray3)">(시작일)</span></label>
      <input class="ef-input" id="ef-date" type="date">
    </div>
    <div class="ef-row">
      <label class="ef-label">종료 날짜 <span style="font-weight:400;color:var(--gray3)">(기간 사건만)</span></label>
      <input class="ef-input" id="ef-date2" type="date">
    </div>
    <div class="ef-row">
      <label class="ef-label">제목</label>
      <input class="ef-input" id="ef-title" type="text" placeholder="사건 제목">
    </div>
    <div class="ef-row">
      <label class="ef-label">카테고리 <span style="font-weight:400;color:var(--gray3)">(복수 선택 가능)</span></label>
      <div class="ef-cats">
        <label class="ef-cat-cb"><input type="checkbox" value="세월호"> 세월호</label>
        <label class="ef-cat-cb"><input type="checkbox" value="재난"> 재난</label>
        <label class="ef-cat-cb"><input type="checkbox" value="산업재해"> 산업재해</label>
        <label class="ef-cat-cb"><input type="checkbox" value="운동/조직"> 운동/조직</label>
        <label class="ef-cat-cb"><input type="checkbox" value="입법/정책"> 입법/정책</label>
      </div>
    </div>
    <div class="ef-row">
      <label class="ef-label">배경 및 경과</label>
      <textarea class="ef-textarea" id="ef-event" placeholder="사건 배경, 원인, 경과"></textarea>
    </div>
    <div class="ef-row">
      <label class="ef-label">쟁점과 의의</label>
      <textarea class="ef-textarea" id="ef-issue" placeholder="주요 쟁점, 사회적 의의"></textarea>
    </div>
    <div class="ef-row">
      <label class="ef-label">시민사회 대응</label>
      <textarea class="ef-textarea" id="ef-civil" placeholder="시민사회, 피해자 운동, 연대 활동"></textarea>
    </div>
    <div class="ef-row">
      <label class="ef-label">결과·입법</label>
      <textarea class="ef-textarea" id="ef-result" placeholder="제도 변화, 입법 결과, 판결 등"></textarea>
    </div>
    <div class="ef-row">
      <label class="ef-label">관련 기사 URL</label>
      <textarea class="ef-textarea" id="ef-articles" rows="2" placeholder="줄바꿈으로 구분해서 입력"></textarea>
      <div class="ef-hint">여러 개는 줄바꿈으로 구분</div>
    </div>
    <div class="ef-row">
      <label class="ef-label">관련 자료집 URL</label>
      <textarea class="ef-textarea" id="ef-docs" rows="2" placeholder="줄바꿈으로 구분해서 입력"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-delete" id="btn-delete" style="display:none">삭제</button>
      <button class="btn-cancel" id="btn-cancel">취소</button>
      <button class="btn-save" id="btn-save">저장</button>
    </div>
  </div>
</div>

<!-- CONN Edit Modal -->
<div class="modal-overlay hidden" id="conn-modal-overlay">
  <div class="modal conn-modal" id="conn-modal">
    <div class="modal-title">연도 흐름 편집</div>
    <input type="hidden" id="cm-id">
    <div class="ef-row">
      <label class="ef-label">시작 연도</label>
      <input class="ef-input" id="cm-from" type="number" placeholder="예: 2014">
    </div>
    <div class="ef-row">
      <label class="ef-label">종료 연도 <span style="font-weight:400;color:var(--gray3)">(선택)</span></label>
      <input class="ef-input" id="cm-to" type="number" placeholder="예: 2016">
    </div>
    <div class="ef-row">
      <label class="ef-label">흐름 설명 라벨</label>
      <input class="ef-input" id="cm-label" type="text" placeholder="예: 피해자 입법 주체화 모델">
    </div>
    <div class="ef-row">
      <label class="ef-label">상세 내용 <span style="font-weight:400;color:var(--gray3)">(팝업에 표시)</span></label>
      <textarea class="ef-textarea" id="cm-desc" rows="4" placeholder="이 시기의 흐름, 특징 등을 설명해주세요"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-delete" id="cm-delete" style="display:none">삭제</button>
      <button class="btn-cancel" id="cm-cancel">취소</button>
      <button class="btn-save" id="cm-save">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════
const SHEET_API = 'https://script.google.com/macros/s/AKfycbwWH-jdWIm-T7vdOLeq_p00ZxnLyKHYVeAJWlnzz2jkVd6WjtCD8TRNcccXpijqKH9Q/exec';

const CATS = ['세월호','재난','산업재해','운동/조직','입법/정책'];

// ══════════════════════════════════════════════════
//  INITIAL DATA
// ══════════════════════════════════════════════════
let EVENTS = [];

let CONNS = [];
let _selectedId = null;
let _filterCat = 'all';
let _editingId = null;

// ══════════════════════════════════════════════════
//  DATE UTILS
// ══════════════════════════════════════════════════
function toISODate(d) {
  if (!d) return '';
  if (typeof d === 'string') {
    if (d.includes('T')) d = d.slice(0, 10);  // 타임스탬프 제거
    if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  }
  return String(d).slice(0, 10);
}
function fmtDate(d) {
  d = toISODate(d);
  if (!d) return '';
  const m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return d;
  if (m[3] === '01' && m[2] === '01') return m[1] + '년';
  if (m[3] === '01') return m[1] + '.' + m[2] + '.';
  return m[1] + '.' + m[2] + '.' + m[3] + '.';
}
function fmtDateRange(d, d2) {
  return d2 ? fmtDate(d) + ' ~ ' + fmtDate(d2) : fmtDate(d);
}
function sortKey(e) {
  return (e.date || (e.year + '-01-01') || '0000-01-01');
}

// ══════════════════════════════════════════════════
//  CAT HELPERS
// ══════════════════════════════════════════════════
function catClass(c) {
  if (c === '운동/조직') return 'cat-movement';
  if (c === '입법/정책') return 'cat-law';
  return c;
}
function catTagHtml(c) {
  return `<span class="cat-tag" data-cat="${c}" style="${catStyle(c)}">${c}</span>`;
}
function catStyle(c) {
  const map = {
    '세월호': 'border-color:var(--cat-sewol);color:var(--cat-sewol)',
    '재난': 'border-color:var(--cat-disaster);color:var(--cat-disaster)',
    '산업재해': 'border-color:var(--cat-labor);color:var(--cat-labor)',
    '운동/조직': 'border-color:var(--cat-movement);color:var(--cat-movement)',
    '입법/정책': 'border-color:var(--cat-law);color:var(--cat-law)',
  };
  return map[c] || '';
}

// ══════════════════════════════════════════════════
//  SORT
// ══════════════════════════════════════════════════
function sortEvents() {
  EVENTS.sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
}

// ══════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════
function render() {
  sortEvents();
  const tl = document.getElementById('timeline');
  const years = [...new Set(EVENTS.map(e => e.year))].sort((a,b) => a-b);

  if (years.length === 0) {
    tl.innerHTML = `<div class="empty-state">
      <p>⏳ 구글 시트에서 데이터를 불러오는 중입니다...</p>
      <p style="font-size:12px">잠시 후 자동으로 표시됩니다</p>
    </div>`;
    return;
  }

  tl.innerHTML = years.map(yr => {
    const events = EVENTS.filter(e => e.year === yr);
    const conn = CONNS.find(c => +c.from === yr);
    const rangeLabel = conn && conn.to && +conn.to !== yr ? ` (~${conn.to})` : '';
    const connHtml = conn
      ? `<div class="conn-pill" data-conn="${conn.id}" style="position:relative;">
           ↑ ${conn.label}${rangeLabel}
           <div class="conn-popup" id="popup-${conn.id}">
             <div class="conn-popup-title">이 시기의 흐름</div>
             <span class="close-btn" onclick="closePopup('${conn.id}')">×</span>
             <div style="margin-bottom:10px">${conn.desc || conn.label}</div>
             <button onclick="openConnModal(${yr})" style="font-size:11px;padding:4px 10px;border:1.5px solid var(--gray4);border-radius:4px;background:#fff;cursor:pointer;width:100%">✏️ 편집</button>
           </div>
         </div>`
      : '';

    const cardsHtml = events.map(e => {
      const cats = Array.isArray(e.cat) ? e.cat : [e.cat];
      const matchFilter = _filterCat === 'all' || cats.includes(_filterCat);
      const hiddenCls = matchFilter ? '' : 'cat-hidden';
      const selCls = e.id === _selectedId ? 'selected' : '';
      const catTags = cats.map(c => catTagHtml(c)).join('');
      const moreEvent = (e.event||'').length > 80;
      return `<div class="event-card ${hiddenCls} ${selCls}" data-id="${e.id}" onclick="selectEvent('${e.id}')">
        <div class="ec-left">
          <div class="ec-title">${e.title}</div>
          <div class="ec-date">${fmtDateRange(e.date, e.date2)}</div>
          <div class="ec-cats">${catTags}</div>
        </div>
        <div class="ec-col">
          <div class="ec-col-label">배경·경과</div>
          <div class="ec-text">${e.event||''}</div>
          ${moreEvent ? '<div class="ec-more">▸ 전체 보기</div>' : ''}
        </div>
        <div class="ec-col">
          <div class="ec-col-label">쟁점과 의의</div>
          <div class="ec-text">${e.issue||''}</div>
        </div>
        <div class="ec-col">
          <div class="ec-col-label">시민사회·결과·입법</div>
          <div class="ec-text">${(e.civil||'') + (e.result ? ' ' + e.result : '')}</div>
        </div>
      </div>`;
    }).join('');

    const groupHidden = _filterCat !== 'all' && !events.some(e => {
      const cats = Array.isArray(e.cat) ? e.cat : [e.cat];
      return cats.includes(_filterCat);
    }) ? 'hidden' : '';

    return `<div class="year-group ${groupHidden}" id="yg-${yr}">
      <div class="year-head">
        <div class="year-label">${yr}년</div>
        ${connHtml}
        ${!conn ? `<button class="add-year-btn" onclick="openConnModal(${yr})">+ 흐름 추가</button>` : ''}
        <button class="add-year-btn" onclick="openAddModal(${yr})" style="margin-left:4px">+ 사건 추가</button>
      </div>
      ${cardsHtml}
    </div>`;
  }).join('');

  // add final "새 연도 추가" block
  tl.innerHTML += `<div style="margin-top:28px;padding-top:20px;border-top:1px dashed var(--gray4)">
    <button class="add-year-btn" onclick="openAddModal(null)" style="font-size:13px;padding:6px 16px">+ 새 사건 추가</button>
  </div>`;
}

// ══════════════════════════════════════════════════
//  SELECT EVENT → DETAIL PANEL
// ══════════════════════════════════════════════════
function selectEvent(id) {
  _selectedId = id;
  render();
  const e = EVENTS.find(ev => ev.id === id);
  if (!e) return;
  const col = document.getElementById('detail-col');
  const panel = document.getElementById('detail-panel');
  col.classList.remove('hidden');
  const cats = Array.isArray(e.cat) ? e.cat : [e.cat];
  const catTags = cats.map(c => catTagHtml(c)).join('');
  const linksHtml = (arr, icon) => arr && arr.length
    ? arr.map(u => `<a class="dp-link" href="${u}" target="_blank">${icon} ${u}</a>`).join('')
    : '';

  panel.innerHTML = `
    <span class="dp-close" onclick="closeDetail()">×</span>
    <div class="dp-cats">${catTags}</div>
    <div class="dp-title">${e.title}</div>
    <div class="dp-date">${fmtDateRange(e.date, e.date2)}</div>
    ${section('배경 및 경과', e.event)}
    ${section('쟁점과 의의', e.issue)}
    ${section('시민사회 대응', e.civil)}
    ${section('결과·입법', e.result)}
    ${(e.articles && e.articles.length) ? `<div class="dp-section"><div class="dp-section-title">관련 기사</div><div class="dp-links">${linksHtml(e.articles,'📰')}</div></div>` : ''}
    ${(e.docs && e.docs.length) ? `<div class="dp-section"><div class="dp-section-title">관련 자료집</div><div class="dp-links">${linksHtml(e.docs,'📄')}</div></div>` : ''}
    <button class="dp-edit-btn" onclick="openEditModal('${e.id}')">✏️ 편집</button>
  `;
}
function section(title, text) {
  if (!text) return '';
  return `<div class="dp-section">
    <div class="dp-section-title">${title}</div>
    <div class="dp-text">${text}</div>
  </div>`;
}
function closeDetail() {
  _selectedId = null;
  document.getElementById('detail-col').classList.add('hidden');
  render();
}

// ══════════════════════════════════════════════════
//  CONN POPUP
// ══════════════════════════════════════════════════
function closePopup(id) {
  document.getElementById('popup-' + id)?.classList.remove('open');
}
document.addEventListener('click', e => {
  const pill = e.target.closest('.conn-pill');
  if (pill) {
    e.stopPropagation();
    const connId = pill.dataset.conn;
    const popup = document.getElementById('popup-' + connId);
    if (popup) popup.classList.toggle('open');
    return;
  }
  document.querySelectorAll('.conn-popup.open').forEach(p => p.classList.remove('open'));
});

// ══════════════════════════════════════════════════
//  CATEGORY FILTER
// ══════════════════════════════════════════════════
document.querySelectorAll('.cat-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    _filterCat = btn.dataset.cat;
    document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    render();
  });
});

// ══════════════════════════════════════════════════
//  EDIT MODAL
// ══════════════════════════════════════════════════
function openAddModal(year) {
  _editingId = null;
  document.getElementById('modal-title').textContent = '새 사건 추가';
  document.getElementById('ef-id').value = '';
  document.getElementById('ef-date').value = year ? year + '-01-01' : '';
  document.getElementById('ef-date2').value = '';
  document.getElementById('ef-title').value = '';
  document.getElementById('ef-event').value = '';
  document.getElementById('ef-issue').value = '';
  document.getElementById('ef-civil').value = '';
  document.getElementById('ef-result').value = '';
  document.getElementById('ef-articles').value = '';
  document.getElementById('ef-docs').value = '';
  document.querySelectorAll('.ef-cat-cb input').forEach(cb => cb.checked = false);
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('ef-date').focus();
}
function openEditModal(id) {
  const e = EVENTS.find(ev => ev.id === id);
  if (!e) return;
  _editingId = id;
  document.getElementById('modal-title').textContent = '사건 편집';
  document.getElementById('ef-id').value = e.id;
  document.getElementById('ef-date').value = e.date || '';
  document.getElementById('ef-date2').value = e.date2 || '';
  document.getElementById('ef-title').value = e.title || '';
  document.getElementById('ef-event').value = e.event || '';
  document.getElementById('ef-issue').value = e.issue || '';
  document.getElementById('ef-civil').value = e.civil || '';
  document.getElementById('ef-result').value = e.result || '';
  document.getElementById('ef-articles').value = (e.articles || []).join('\n');
  document.getElementById('ef-docs').value = (e.docs || []).join('\n');
  const cats = Array.isArray(e.cat) ? e.cat : [e.cat];
  document.querySelectorAll('.ef-cat-cb input').forEach(cb => {
    cb.checked = cats.includes(cb.value);
  });
  document.getElementById('btn-delete').style.display = 'block';
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

document.getElementById('btn-save').addEventListener('click', () => {
  const date = document.getElementById('ef-date').value;
  const title = document.getElementById('ef-title').value.trim();
  if (!date || !title) { showToast('날짜와 제목은 필수입니다'); return; }

  const cats = [...document.querySelectorAll('.ef-cat-cb input:checked')].map(cb => cb.value);
  if (!cats.length) { showToast('카테고리를 하나 이상 선택해주세요'); return; }

  const year = parseInt(date.slice(0, 4));
  const id = _editingId || (date.slice(0,4) + '-' + title.slice(0,6).replace(/\s/g,'')).replace(/[^\w가-힣-]/g,'');

  const ev = {
    id, year, date,
    date2: document.getElementById('ef-date2').value || undefined,
    title,
    cat: cats,
    event: document.getElementById('ef-event').value.trim(),
    issue: document.getElementById('ef-issue').value.trim(),
    civil: document.getElementById('ef-civil').value.trim(),
    result: document.getElementById('ef-result').value.trim(),
    articles: document.getElementById('ef-articles').value.split('\n').map(s=>s.trim()).filter(Boolean),
    docs: document.getElementById('ef-docs').value.split('\n').map(s=>s.trim()).filter(Boolean),
  };
  if (!ev.date2) delete ev.date2;

  if (_editingId) {
    const idx = EVENTS.findIndex(e => e.id === _editingId);
    if (idx >= 0) EVENTS[idx] = ev;
  } else {
    EVENTS.push(ev);
  }
  sortEvents();
  closeModal();
  render();
  if (_editingId) selectEvent(ev.id);
  showToast('저장됐습니다');
});

document.getElementById('btn-delete').addEventListener('click', () => {
  if (!_editingId) return;
  if (!confirm('이 사건을 삭제할까요?')) return;
  EVENTS = EVENTS.filter(e => e.id !== _editingId);
  closeModal();
  closeDetail();
  render();
  showToast('삭제됐습니다');
});

// ══════════════════════════════════════════════════
//  CONN MODAL
// ══════════════════════════════════════════════════
function openConnModal(year) {
  const existing = CONNS.find(c => +c.from === year);
  document.getElementById('cm-id').value = existing ? existing.id : '';
  document.getElementById('cm-from').value = year || '';
  document.getElementById('cm-to').value = existing ? (existing.to || '') : '';
  document.getElementById('cm-label').value = existing ? existing.label : '';
  document.getElementById('cm-desc').value = existing ? (existing.desc || '') : '';
  document.getElementById('cm-delete').style.display = existing ? 'block' : 'none';
  document.getElementById('conn-modal-overlay').classList.remove('hidden');
}
document.getElementById('cm-cancel').addEventListener('click', () => {
  document.getElementById('conn-modal-overlay').classList.add('hidden');
});
document.getElementById('conn-modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('conn-modal-overlay'))
    document.getElementById('conn-modal-overlay').classList.add('hidden');
});
document.getElementById('cm-save').addEventListener('click', () => {
  const from = document.getElementById('cm-from').value;
  const label = document.getElementById('cm-label').value.trim();
  if (!from || !label) { showToast('시작 연도와 라벨은 필수입니다'); return; }
  const conn = {
    id: document.getElementById('cm-id').value || ('conn-' + from),
    from: +from,
    to: document.getElementById('cm-to').value ? +document.getElementById('cm-to').value : null,
    label,
    desc: document.getElementById('cm-desc').value.trim(),
  };
  const idx = CONNS.findIndex(c => c.id === conn.id || +c.from === +from);
  if (idx >= 0) CONNS[idx] = conn;
  else CONNS.push(conn);
  document.getElementById('conn-modal-overlay').classList.add('hidden');
  render();
  showToast('흐름이 저장됐습니다');
});
document.getElementById('cm-delete').addEventListener('click', () => {
  const id = document.getElementById('cm-id').value;
  CONNS = CONNS.filter(c => c.id !== id);
  document.getElementById('conn-modal-overlay').classList.add('hidden');
  render();
  showToast('흐름이 삭제됐습니다');
});

// ══════════════════════════════════════════════════
//  SHEET API
// ══════════════════════════════════════════════════
async function loadFromSheet() {
  if (SHEET_API === 'PASTE_YOUR_GAS_URL_HERE') {
    showToast('⚠️ Apps Script URL을 설정해주세요');
    return;
  }
  try {
    showToast('📊 시트에서 불러오는 중...');
    const res = await fetch(SHEET_API);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (data.events && data.events.length > 0) {
      EVENTS = data.events.map(e => ({
        ...e,
        year: +e.year,
        date: toISODate(e.date),
        date2: toISODate(e.date2),
        cat: Array.isArray(e.cat) ? e.cat
          : String(e.cat||'').split(',').map(s=>s.trim()).filter(Boolean),
        articles: Array.isArray(e.articles) ? e.articles : [],
        docs: Array.isArray(e.docs) ? e.docs : [],
      }));
    }
    if (data.conns) CONNS = data.conns;
    sortEvents();
    render();
    saveCache();
    showToast('✅ 시트에서 불러왔습니다 (' + EVENTS.length + '건)');
  } catch(err) {
    showToast('❌ 불러오기 실패: ' + err.message);
  }
}

async function saveToSheet() {
  if (SHEET_API === 'PASTE_YOUR_GAS_URL_HERE') {
    showToast('⚠️ Apps Script URL을 설정해주세요');
    return;
  }
  const btn = document.getElementById('sheet-save-btn');
  btn.textContent = '☁️ 저장 중...';
  btn.classList.add('saving');
  try {
    const payload = {
      events: EVENTS.map(e => ({
        ...e,
        cat: Array.isArray(e.cat) ? e.cat.join(',') : (e.cat || '')
      })),
      conns: CONNS
    };
    const res = await fetch(SHEET_API, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    showToast('✅ 시트에 저장됐습니다 (' + data.saved + '건)');
  } catch(err) {
    showToast('❌ 저장 실패: ' + err.message);
  } finally {
    btn.textContent = '☁️ 시트에 저장';
    btn.classList.remove('saving');
  }
}

// ══════════════════════════════════════════════════
//  JSON EXPORT
// ══════════════════════════════════════════════════
document.getElementById('exp-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({events: EVENTS, conns: CONNS}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lifesafe-timeline.json';
  a.click();
});

// ══════════════════════════════════════════════════
//  SHEET BUTTONS
// ══════════════════════════════════════════════════
document.getElementById('sheet-load-btn').addEventListener('click', loadFromSheet);
document.getElementById('sheet-save-btn').addEventListener('click', saveToSheet);

// ══════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════════
//  LOCAL CACHE
// ══════════════════════════════════════════════════
const CACHE_KEY = 'lifesafe_cache';

function saveCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ events: EVENTS, conns: CONNS }));
  } catch(e) {}
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.events && data.events.length > 0) {
      EVENTS = data.events;
      CONNS = data.conns || [];
      return true;
    }
  } catch(e) {}
  return false;
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
// 1) 캐시가 있으면 캐시(=마지막 최신버전)로 즉시 표시
if (loadCache()) {
  sortEvents();
  render();
}
// 2) 하드코딩 데이터가 없을 경우 fallback
else {
  sortEvents();
  render();
}
// 3) 항상 시트에서 최신 데이터 로드 (완료 후 캐시 갱신)
loadFromSheet();
</script>
